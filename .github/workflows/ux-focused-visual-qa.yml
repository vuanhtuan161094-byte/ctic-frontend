name: CMP Focused Visual QA

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "app/globals.css"
      - "app/components/certification-audit/**"
      - "app/components/CertificationProjectDetailScreen.tsx"
      - "e2e/specs/audit-workspace-layout.spec.mjs"
      - "e2e/specs/audit-team-assignment-layout.spec.mjs"
      - "e2e/specs/login-screen-layout.spec.mjs"
      - "e2e/helpers/quality.mjs"
      - ".github/workflows/ux-focused-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-focused-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - name: Install app
        run: npm ci
      - name: Install browser QA
        run: npm --prefix e2e ci
      - name: Install Chromium
        run: cd e2e && npx playwright install --with-deps chromium
      - name: Capture login, dossier, appointment and seven audit sections
        run: cd e2e && ./node_modules/.bin/playwright test specs/login-screen-layout.spec.mjs specs/audit-workspace-layout.spec.mjs specs/audit-team-assignment-layout.spec.mjs --workers=1 --retries=0
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmp-ux-focused-visual-${{ github.run_attempt }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
