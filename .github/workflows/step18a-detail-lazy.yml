name: CMP Step 18A Detail Lazy Migration

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - scripts/step18a-detail-lazy.mjs
      - .github/workflows/step18a-detail-lazy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step18a-detail-lazy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded lazy migration
        run: node scripts/step18a-detail-lazy.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production TypeScript
        run: npm run typecheck
      - name: Repository TypeScript
        run: npm run typecheck:all
      - name: Zero-warning lint
        run: npm run lint
      - name: Build and full frontend regression
        run: npm test
      - name: Verify bounded diff
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^(app/components/CertificationProjectDetailScreen\.tsx|scripts/step18a-detail-lazy\.mjs)$' || true)
          if [ -n "$unexpected" ]; then echo "Unexpected changed files:"; echo "$unexpected"; exit 1; fi
          git diff --check
      - name: Remove one-shot migration script
        run: rm scripts/step18a-detail-lazy.mjs
      - name: Commit and push verified optimization
        shell: bash
        run: |
          git config user.name "cmp-step18a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A app/components/CertificationProjectDetailScreen.tsx scripts/step18a-detail-lazy.mjs
          git diff --cached --check
          git commit -m "perf(step18a): lazy-load detail compatibility surfaces"
          git push origin HEAD:feature/step18a-stabilization
