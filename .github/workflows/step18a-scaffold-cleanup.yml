name: CMP Step 18A Scaffold Cleanup

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - scripts/step18a-scaffold-cleanup.mjs
      - .github/workflows/step18a-scaffold-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: step18a-scaffold-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded scaffold cleanup
        run: node scripts/step18a-scaffold-cleanup.mjs
      - name: Replace Next lint coupling and regenerate lockfile
        run: npm install --save-dev @eslint/js@^9 @typescript-eslint/parser@^8 eslint-plugin-react-hooks@^7 globals@^16 --package-lock-only --ignore-scripts
      - name: Clean-install reduced dependency graph
        run: npm ci
      - name: Production TypeScript
        run: npm run typecheck
      - name: Repository TypeScript
        run: npm run typecheck:all
      - name: Zero-warning lint
        run: npm run lint
      - name: Build and full frontend regression
        run: npm test
      - name: Dependency audit snapshot
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/npm-audit.json","utf8")); console.log("npm audit vulnerabilities:", JSON.stringify(x.metadata?.vulnerabilities ?? {})); console.log("npm dependency count:", x.metadata?.dependencies?.total ?? "unknown");'
      - name: Verify scaffold removal and bounded diff
        shell: bash
        run: |
          for path in worker db drizzle examples .openai vite.config.ts next.config.ts drizzle.config.ts app/layout.tsx app/page.tsx app/chatgpt-auth.ts; do
            if [ -e "$path" ]; then echo "Unexpected stale scaffold remains: $path"; exit 1; fi
          done
          if grep -Eq '"(next|vinext|drizzle-orm|drizzle-kit|wrangler|eslint-config-next)"' package.json; then
            echo "Obsolete scaffold dependency remains in package.json"; exit 1
          fi
          if grep -q 'continue-on-error: true' .github/workflows/frontend-quality.yml; then
            echo "Repository TypeScript gate is still soft"; exit 1
          fi
          unexpected=$(git diff --name-only | grep -Ev '^(\.openai/|app/chatgpt-auth\.ts$|app/layout\.tsx$|app/page\.tsx$|db/|drizzle/|drizzle\.config\.ts$|examples/|next\.config\.ts$|vite\.config\.ts$|worker/|package\.json$|package-lock\.json$|tsconfig\.all\.json$|eslint\.config\.mjs$|README\.md$|scripts/step18a-scaffold-cleanup\.mjs$)' || true)
          if [ -n "$unexpected" ]; then echo "Unexpected changed files:"; echo "$unexpected"; exit 1; fi
          git diff --check
      - name: Remove one-shot migration script
        run: rm scripts/step18a-scaffold-cleanup.mjs
      - name: Commit and push verified cleanup
        shell: bash
        run: |
          git config user.name "cmp-step18a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(step18a): remove obsolete frontend scaffold"
          git push origin HEAD:feature/step18a-stabilization
