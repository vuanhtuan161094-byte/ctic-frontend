name: CMP Step 18A Route Lazy Migration

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - scripts/step18a-route-lazy.mjs
      - .github/workflows/step18a-route-lazy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded route lazy migration
        run: node scripts/step18a-route-lazy.mjs
      - name: Remove one-shot files
        run: |
          rm scripts/step18a-route-lazy.mjs
          rm .github/workflows/step18a-route-lazy.yml
      - name: Verify bounded diff
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^(app/components/DashboardShell\.tsx|scripts/step18a-route-lazy\.mjs|\.github/workflows/step18a-route-lazy\.yml)$' || true)
          if [ -n "$unexpected" ]; then echo "$unexpected"; exit 1; fi
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "cmp-step18a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A app/components/DashboardShell.tsx scripts/step18a-route-lazy.mjs .github/workflows/step18a-route-lazy.yml
          git commit -m "perf(step18a): lazy-load heavy dashboard screens"
          git push origin HEAD:feature/step18a-stabilization
