name: CMP Step 18A NPM Audit

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - .github/workflows/step18a-npm-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full dependency audit
        shell: bash
        run: |
          npm audit --json > audit-all.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-all.json', 'utf8'));
          console.log('FULL_METADATA=' + JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log('FULL_VULN=' + JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              nodes: item.nodes,
              effects: item.effects,
              via: (item.via ?? []).map(v => typeof v === 'string' ? v : ({ source: v.source, name: v.name, dependency: v.dependency, title: v.title, url: v.url, severity: v.severity, range: v.range })),
              fixAvailable: item.fixAvailable,
            }));
          }
          NODE
      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-prod.json', 'utf8'));
          console.log('PROD_METADATA=' + JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log('PROD_VULN=' + JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              nodes: item.nodes,
              effects: item.effects,
              via: (item.via ?? []).map(v => typeof v === 'string' ? v : ({ source: v.source, name: v.name, dependency: v.dependency, title: v.title, url: v.url, severity: v.severity, range: v.range })),
              fixAvailable: item.fixAvailable,
            }));
          }
          NODE
