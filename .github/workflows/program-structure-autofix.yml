name: CMP Program UX Autofix

on:
  push:
    branches: ["feature/ux-fix-batch01"]
    paths: [".github/workflows/program-structure-autofix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ux-fix-batch01
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply bounded patch
        shell: bash
        run: |
          python scripts/program-structure-autofix.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app/components/CustomerApplicationsScreen.tsx')
          s = p.read_text(encoding='utf-8')

          # Keep persisted DTO shape singular while the edit form uses a multi-select.
          start = s.index('interface CustomerApplication {')
          end = s.index('\n}\n\ninterface ApplicationFormValues', start)
          block = s[start:end]
          block = block.replace('  standard_names: string[];', '  standard_name: string;', 1)
          s = s[:start] + block + s[end:]
          start = s.index('interface ApplicationFormValues {')
          end = s.index('\n}\n\nconst portalStatusMeta', start)
          block = s[start:end]
          block = block.replace('  standard_name: string;', '  standard_names: string[];', 1)
          s = s[:start] + block + s[end:]

          # Give multi-standard selection a full row so long integrated scopes remain readable.
          old = '''            <Col xs={24} md={8}>
              <Form.Item label="Ngày đăng ký" name="application_date" rules={[{ required: true, message: "Chọn ngày đăng ký" }]}>
                <DatePicker format="DD/MM/YYYY" style={{ width: "100%" }} />
              </Form.Item>
            </Col>
            <Col xs={24} md={8}>
              <Form.Item label="Loại chứng nhận" name="certification_type">
                <Select options={[
                  { value: "INITIAL", label: "Chứng nhận lần đầu" },
                  { value: "TRANSFER", label: "Chuyển đổi chứng nhận" },
                  { value: "OTHER", label: "Khác" },
                ]} />
              </Form.Item>
            </Col>
            <Col xs={24} md={8}>
              <Form.Item
                extra="Chỉ hiển thị tiêu chuẩn mà tổ chức chứng nhận đang tiếp nhận."
                label="Tiêu chuẩn"
'''
          new = '''            <Col xs={24} md={12}>
              <Form.Item label="Ngày đăng ký" name="application_date" rules={[{ required: true, message: "Chọn ngày đăng ký" }]}>
                <DatePicker format="DD/MM/YYYY" style={{ width: "100%" }} />
              </Form.Item>
            </Col>
            <Col xs={24} md={12}>
              <Form.Item label="Loại chứng nhận" name="certification_type">
                <Select options={[
                  { value: "INITIAL", label: "Chứng nhận lần đầu" },
                  { value: "TRANSFER", label: "Chuyển đổi chứng nhận" },
                  { value: "OTHER", label: "Khác" },
                ]} />
              </Form.Item>
            </Col>
            <Col xs={24}>
              <Form.Item
                extra="Chỉ hiển thị tiêu chuẩn mà tổ chức chứng nhận đang tiếp nhận."
                label="Tiêu chuẩn áp dụng"
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'label="Tiêu chuẩn áp dụng"' not in s:
              raise SystemExit('customer standard layout anchor missing')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify frontend
        run: |
          npm run typecheck
          npm run typecheck:all
          npm run lint
          npm test
      - name: Commit verified patch
        run: |
          git config user.name "cmp-automation"
          git config user.email "cmp-automation@users.noreply.github.com"
          git add app/components/CertificationProjectsScreen.tsx app/components/CustomerApplicationsScreen.tsx app/components/DashboardShell.tsx app/components/CertificationProgramsPanel.tsx tests/program-structure-authority.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No frontend patch needed"
          else
            git commit -m "ux: refine application standard selection"
            git push origin HEAD:feature/ux-fix-batch01
          fi
