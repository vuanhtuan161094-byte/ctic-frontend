name: CMP Step 18A Lint Cleanup

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - scripts/step18a-lint-cleanup.mjs
      - .github/workflows/step18a-lint-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply bounded lint cleanup
        run: node scripts/step18a-lint-cleanup.mjs

      - name: Remove one-shot migration files
        run: |
          rm scripts/step18a-lint-cleanup.mjs
          rm .github/workflows/step18a-lint-cleanup.yml

      - name: Verify bounded patch
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^(app/components/(CertificationBodyCapabilitiesPanel|ControlledDocumentPanel|CustomerPortalAccountModal|DocumentPreviewModal)\.tsx|app/lib/ooxml-preview\.ts|eslint\.config\.mjs|scripts/step18a-lint-cleanup\.mjs|\.github/workflows/step18a-lint-cleanup\.yml)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check
          git diff --stat

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "cmp-step18a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A app/components/CertificationBodyCapabilitiesPanel.tsx \
                     app/components/ControlledDocumentPanel.tsx \
                     app/components/CustomerPortalAccountModal.tsx \
                     app/components/DocumentPreviewModal.tsx \
                     app/lib/ooxml-preview.ts \
                     eslint.config.mjs \
                     scripts/step18a-lint-cleanup.mjs \
                     .github/workflows/step18a-lint-cleanup.yml
          git commit -m "fix(step18a): close production lint findings"
          git push origin HEAD:feature/step18a-stabilization
