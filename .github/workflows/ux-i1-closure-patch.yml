name: UX-I1 Closure Patch

on:
  push:
    branches:
      - feature/ux-fix-batch01
    paths:
      - .github/workflows/ux-i1-closure-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ux-fix-batch01

      - name: Apply narrowly scoped UX-I1 closure fixes
        shell: python {0}
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly 1 match in {path!r}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app/components/certification-case/CertificationCaseOverview.tsx",
              '<Progress percent={cycle?.summary.completion_percentage ?? 0} size="small" strokeColor="var(--cmp-brand-primary)" />',
              '<Progress aria-label="Mức hoàn thiện nguồn hồ sơ" percent={cycle?.summary.completion_percentage ?? 0} size="small" strokeColor="var(--cmp-brand-primary)" />',
          )

          replace_once(
              "app/components/DashboardShell.tsx",
              'styles={{ body: { padding: 0, background: "var(--cmp-brand-strong)" } }} width={286}',
              'styles={{ body: { padding: 0, background: "var(--cmp-brand-strong)" } }} size={286}',
          )

          replace_once(
              "app/components/CertificationProgramsPanel.tsx",
              '<Space direction="vertical" size={10} style={{ width: "100%" }}>',
              '<Space orientation="vertical" size={10} style={{ width: "100%" }}>',
          )

          programs = Path("app/components/CertificationProgramsPanel.tsx")
          programs_text = programs.read_text(encoding="utf-8")
          green_count = programs_text.count('color="green"')
          if green_count != 2:
              raise SystemExit(f"Expected exactly 2 green status tags, found {green_count}")
          programs.write_text(programs_text.replace('color="green"', 'color="success"'), encoding="utf-8")

          replace_once(
              "app/components/UiRuntime.tsx",
              'import type { ReactNode } from "react";\n\nimport { PLATFORM_BRANDING }',
              'import type { ReactNode } from "react";\n\nimport "./ux-i1-accessibility-closure.css";\nimport { PLATFORM_BRANDING }',
          )
          replace_once(
              "app/components/UiRuntime.tsx",
              '          colorError: "#c83b3b",\n          borderRadius: 10,',
              '          colorError: "#c83b3b",\n          colorTextSecondary: "#5f6b7a",\n          borderRadius: 10,',
          )

          replace_once(
              "app/components/design-system/tokens.css",
              '  --cmp-text-secondary: #66758d;',
              '  --cmp-text-secondary: #5f6b7a;',
          )

          closure_css = (
              "/* UX-I1 accessibility closure only. Keep these narrow overrides until UX-I2 token governance is approved. */\n"
              ".application-shell .main-menu .ant-menu-item-group-title {\n"
              "  color: #8fa6c7 !important;\n"
              "}\n\n"
              ".application-shell .global-search-trigger > span:nth-child(2),\n"
              ".application-shell .global-search-trigger kbd {\n"
              "  color: #5f6b7a;\n"
              "}\n"
          )
          Path("app/components/ux-i1-accessibility-closure.css").write_text(closure_css, encoding="utf-8")

          Path(".github/workflows/ux-i1-closure-patch.yml").unlink()

      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- app/components/certification-case/CertificationCaseOverview.tsx app/components/DashboardShell.tsx app/components/CertificationProgramsPanel.tsx app/components/UiRuntime.tsx app/components/design-system/tokens.css app/components/ux-i1-accessibility-closure.css

      - name: Commit approved UX-I1 closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/certification-case/CertificationCaseOverview.tsx
          git add app/components/DashboardShell.tsx
          git add app/components/CertificationProgramsPanel.tsx
          git add app/components/UiRuntime.tsx
          git add app/components/design-system/tokens.css
          git add app/components/ux-i1-accessibility-closure.css
          git add .github/workflows/ux-i1-closure-patch.yml
          git commit -m "fix(ux-i1): close browser accessibility debt"
          git push origin HEAD:feature/ux-fix-batch01
