name: CMP Step 18A Safe Migrations

on:
  push:
    branches:
      - feature/step18a-stabilization
    paths:
      - scripts/step18a-safe-type-fixes.mjs
      - .github/workflows/step18a-safe-migrations.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/step18a-stabilization
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply deterministic migration
        run: node scripts/step18a-safe-type-fixes.mjs

      - name: Verify patch is limited to expected files
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^(app/components/(AuditDocumentCenterModal|CertificationProjectDetailScreen|CertificationProjectsScreen|ScheduleResourcesScreen)\.tsx|app/lib/ooxml-preview\.ts)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check
          git diff --stat

      - name: Commit safe migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "cmp-step18a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/components/AuditDocumentCenterModal.tsx \
                  app/components/CertificationProjectDetailScreen.tsx \
                  app/components/CertificationProjectsScreen.tsx \
                  app/components/ScheduleResourcesScreen.tsx \
                  app/lib/ooxml-preview.ts
          git commit -m "fix(step18a): apply safe production type migrations"
          git push origin HEAD:feature/step18a-stabilization
