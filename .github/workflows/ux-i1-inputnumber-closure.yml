name: UX-I1 InputNumber Closure

on:
  push:
    branches:
      - feature/ux-fix-batch01
    paths:
      - .github/workflows/ux-i1-inputnumber-closure.yml

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ux-fix-batch01

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Apply narrow InputNumber closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/components/CertificationProgramsPanel.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"Expected {expected} matches, found {count}: {old!r}")
              text = text.replace(old, new)

          replace_exact(
              'import { useMemo, useState } from "react";\n',
              'import { useMemo, useState } from "react";\nimport type { ComponentProps } from "react";\n',
          )

          marker = '''function nextRuleVersion(rows: SchemeConfig[]) {
            return rows.reduce((max, row) => Math.max(max, Number(row.version_no) || 0), 0) + 1;
          }
          '''
          helper = '''function nextRuleVersion(rows: SchemeConfig[]) {
            return rows.reduce((max, row) => Math.max(max, Number(row.version_no) || 0), 0) + 1;
          }

          type RuleNumberInputProps = ComponentProps<typeof InputNumber> & { unit: string };

          function RuleNumberInput({ unit, style, ...props }: RuleNumberInputProps) {
            return (
              <Space.Compact style={{ width: "100%" }}>
                <InputNumber {...props} style={{ width: "100%", ...style }} />
                <Input
                  aria-label={`Đơn vị: ${unit}`}
                  readOnly
                  tabIndex={-1}
                  value={unit}
                  style={{ width: unit === "tháng/lần" ? 96 : 72, textAlign: "center", pointerEvents: "none" }}
                />
              </Space.Compact>
            );
          }
          '''
          replace_exact(marker, helper)

          replace_exact(
              '<InputNumber min={1} addonAfter="tháng" style={{ width: "100%" }} />',
              '<RuleNumberInput min={1} unit="tháng" />',
              expected=2,
          )
          replace_exact(
              '<InputNumber min={1} addonAfter="tháng/lần" style={{ width: "100%" }} />',
              '<RuleNumberInput min={1} unit="tháng/lần" />',
          )
          replace_exact(
              '<InputNumber min={0} addonAfter="ngày" style={{ width: "100%" }} />',
              '<RuleNumberInput min={0} unit="ngày" />',
              expected=2,
          )

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/ux-i1-inputnumber-closure.yml").unlink()
          PY

          git diff --check
          git diff -- app/components/CertificationProgramsPanel.tsx

      - name: Install application dependencies
        run: npm ci

      - name: Production app typecheck
        run: npm run typecheck

      - name: Repository TypeScript
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Build and full frontend tests
        run: npm test

      - name: Install browser QA dependencies
        run: npm --prefix e2e ci

      - name: Install Chromium
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Run Playwright and axe closure gate
        run: npm --prefix e2e test

      - name: Commit verified UX-I1 closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/CertificationProgramsPanel.tsx
          git add .github/workflows/ux-i1-inputnumber-closure.yml
          git commit -m "fix(ux-i1): replace deprecated InputNumber addons"
          git push origin HEAD:feature/ux-fix-batch01
