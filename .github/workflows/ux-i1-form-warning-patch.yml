name: UX-I1 Form Warning Patch

on:
  push:
    branches:
      - feature/ux-fix-batch01
    paths:
      - .github/workflows/ux-i1-form-warning-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ux-fix-batch01

      - name: Apply Form-Modal wiring fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/components/CertificationProgramsPanel.tsx")
          text = path.read_text(encoding="utf-8")

          regular_old = "        destroyOnHidden\n      >"
          regular_new = "        destroyOnHidden\n        forceRender\n      >"
          regular_count = text.count(regular_old)
          if regular_count != 2:
              raise SystemExit(f"Expected 2 regular form modals, found {regular_count}")
          text = text.replace(regular_old, regular_new)

          rule_old = "        destroyOnHidden\n        width={760}\n      >"
          rule_new = "        destroyOnHidden\n        forceRender\n        width={760}\n      >"
          rule_count = text.count(rule_old)
          if rule_count != 1:
              raise SystemExit(f"Expected 1 rule form modal, found {rule_count}")
          text = text.replace(rule_old, rule_new)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/ux-i1-form-warning-patch.yml").unlink()
          PY

      - name: Verify patch
        run: |
          git diff --check
          git diff -- app/components/CertificationProgramsPanel.tsx

      - name: Commit UX-I1 Form-Modal wiring closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/CertificationProgramsPanel.tsx
          git add .github/workflows/ux-i1-form-warning-patch.yml
          git commit -m "fix(ux-i1): connect modal forms before control calls"
          git push origin HEAD:feature/ux-fix-batch01
