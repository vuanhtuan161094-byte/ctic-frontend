name: CMP Frontend Quality

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production app typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Full-repository TypeScript debt snapshot
        continue-on-error: true
        run: npm run typecheck:all
